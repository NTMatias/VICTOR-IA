<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>VICTOR.IA · Cuenta</title>
<script>
// Never forward, log or retain authentication tokens in a public confirmation page.
const result = new URLSearchParams(location.hash.slice(1));
const failed = result.has('error');
const confirmed = result.has('access_token') && !failed;
history.replaceState(null, '', location.pathname);
addEventListener('DOMContentLoaded', () => {
  document.getElementById('title').textContent = failed ? 'El enlace no pudo completarse' : confirmed ? 'Correo confirmado' : 'Tu cuenta de VICTOR.IA';
  document.getElementById('message').textContent = failed ? 'El enlace puede haber caducado o haberse usado. Vuelve a VICTOR.IA e intenta iniciar sesión. Si el correo sigue pendiente, solicita otro enlace.' : 'Vuelve a la aplicación VICTOR.IA e inicia sesión con tu correo y contraseña. Ya puedes cerrar esta pestaña.';
});
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#292644,#12151e 70%);color:#eef1fa;font:17px/1.65 system-ui,Segoe UI,sans-serif}
main{max-width:520px;margin:24px;padding:44px;background:#1d2231;border:1px solid #414865;border-radius:24px;box-shadow:0 24px 70px #0005}
.brand{font-weight:750;letter-spacing:.05em;color:#9cbbff}h1{font-size:30px;line-height:1.2}p{color:#c3cbdf}.note{font-size:13px;color:#95a1bb}
</style>
</head>
<body><main><div class="brand">VICTOR.IA</div><h1 id="title">Tu cuenta de VICTOR.IA</h1><p id="message">Vuelve a VICTOR.IA para continuar.</p><p class="note">Esta página no guarda tu contraseña ni tu sesión.</p></main></body>
</html>
